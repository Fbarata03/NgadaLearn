name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Create README for NgadaLearn/package-lock.json'

      - name: Install dependencies
        working-directory: 'Create README for NgadaLearn'
        run: npm ci

      - name: Build (produção)
        working-directory: 'Create README for NgadaLearn'
        run: npm run build

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'Create README for NgadaLearn/dist'
          # Garante que URLs directas (ex: /NgadaLearn/login) funcionam via 404.html
          enable_jekyll: false
