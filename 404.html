<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>NgadaLearn</title>
  <script>
    /* GitHub Pages SPA redirect — domínio raiz (ngadalearn.pt) */
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
