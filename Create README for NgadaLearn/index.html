    <!-- ── Título e descrição ── -->

    <meta name="description" content="Aprende inglês de forma divertida com músicas e filmes. Plataforma gratuita para estudantes de língua inglesa." />

    <meta name="author" content="NgadaLearn" />
    <meta name="robots" content="index, follow" />

    <!-- ── URL canónica ── -->

    <!-- ── Open Graph (Facebook, WhatsApp, Discord) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ngadalearn.pt/" />
    <meta property="og:title" content="NgadaLearn — Aprende Inglês com Música e Filmes" />
    <meta property="og:description" content="Aprende inglês de forma divertida com músicas e filmes. Plataforma gratuita para estudantes de língua inglesa." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ── Cor da barra do browser (mobile) ── -->

    <!-- ── Estilos base ── -->
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <script>
      /* Restaurar rota guardada pelo 404.html (GitHub Pages SPA) */
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(
            null, null,
            window.location.pathname.replace(/\/?$/, '') + decodeURIComponent(p)
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
