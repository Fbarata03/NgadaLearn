<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>NgadaLearn</title>
  <script>
    /*
     * GitHub Pages SPA redirect
     * Guarda o caminho actual na query string e redireciona para index.html
     * O script em index.html restaura o caminho via history.replaceState
     */
    var l = window.location;
    var base = '/NgadaLearn';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      base + '/?p=' +
      encodeURIComponent(l.pathname.slice(base.length) + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
